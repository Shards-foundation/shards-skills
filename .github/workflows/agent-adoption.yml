name: Agent Skill Adoption Evidence
on:
  pull_request:
    paths:
      - 'scripts/agent_adoption_eval.py'
      - 'scripts/host_ab_eval.py'
      - 'scripts/search_skills.py'
      - 'catalogue/catalogue.json'
      - 'skills/**/SKILL.md'
      - 'plugins/shards-core/skills/**/SKILL.md'
      - 'scripts/dispatch_skills.py'
      - 'tests/test_agent_adoption_eval.py'
      - 'tests/test_host_ab_eval.py'
      - 'tests/test_skill_search.py'
      - 'evals/trigger-cases.json'
      - 'docs/agent-adoption.md'
      - 'docs/host-ab-evaluation.md'
      - '.github/workflows/agent-adoption.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/agent_adoption_eval.py'
      - 'scripts/host_ab_eval.py'
      - 'scripts/search_skills.py'
      - 'catalogue/catalogue.json'
      - 'skills/**/SKILL.md'
      - 'plugins/shards-core/skills/**/SKILL.md'
      - 'scripts/dispatch_skills.py'
      - 'tests/test_agent_adoption_eval.py'
      - 'tests/test_host_ab_eval.py'
      - 'tests/test_skill_search.py'
      - 'evals/trigger-cases.json'
      - 'docs/agent-adoption.md'
      - 'docs/host-ab-evaluation.md'
      - '.github/workflows/agent-adoption.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test evaluation tool
        run: |
          python -m py_compile scripts/agent_adoption_eval.py scripts/host_ab_eval.py
          python -m unittest discover -s tests -p 'test_agent_adoption_eval.py' -v
          python -m unittest discover -s tests -p 'test_host_ab_eval.py' -v
      - name: Produce actual retrieval diagnostics (not host invocation claims)
        run: |
          python scripts/agent_adoption_eval.py > agent-retrieval-report.json
          python - <<'PY'
          import json
          with open('agent-retrieval-report.json', encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['evaluation'] == 'metadata_retrieval_only'
          assert report['negative_trigger_assessed'] is False
          assert all(not result['agent_activation_verified'] for result in report['results'])
          print('Recall@1:', report['recall_at_1'])
          print('Recall@3:', report['recall_at_3'])
          print('Recall@5:', report['recall_at_5'])
          PY
      - name: Discover, plan, and execute a governed first-party skill
        run: |
          SKILL=$(python scripts/search_skills.py --query "repository health" --status curated --limit 1 | python -c 'import json,sys; print(json.load(sys.stdin)["results"][0]["name"])')
          test "$SKILL" = "shards-repository-health"
          PLAN_SHA=$(python scripts/dispatch_skills.py plan --skill "$SKILL" | python -c 'import json,sys; print(json.load(sys.stdin)["plan_sha256"])')
          python scripts/dispatch_skills.py run --skill "$SKILL" --execute --expect-plan-sha256 "$PLAN_SHA" --save-receipt > governed-skill-execution.json
          python - <<'PY'
          import json
          with open('governed-skill-execution.json', encoding='utf-8') as stream:
              run = json.load(stream)
          assert run['skill'] == 'shards-repository-health'
          assert run['executed'] is True
          assert run['observation']['status'] == 'pass'
          assert run['observation']['exit_code'] == 0
          assert run['production_verified'] is False
          print('Governed Shards skill executed with pinned plan; local pass recorded.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skill-retrieval-diagnostics
          path: |
            agent-retrieval-report.json
            governed-skill-execution.json
          retention-days: 7
