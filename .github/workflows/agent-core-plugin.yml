name: Agent Core Plugin Gates
on:
  push:
    branches: [main]
    paths:
      - 'skills/trader-*/**'
      - 'third_party/day-trader-skill/**'
      - 'docs/day-trader-skills.md'
      - 'skills/shards-sec-*/**'
      - 'catalogue/catalogue.json'
      - 'catalogue/shards-security-controls.json'
      - 'scripts/security_assurance.py'
      - 'scripts/vibecode_guard.py'
      - 'tests/test_vibecode_guard.py'
      - 'tests/test_vibecode_guard_calibration.py'
      - 'tests/test_vibecode_guard_review.py'
      - 'tests/test_vibecode_guard_adversarial.py'
      - 'tests/test_security_assurance.py'
      - 'tests/test_security_suite.py'
      - 'tests/test_security_skill_eval.py'
      - 'scripts/security_skill_eval.py'
      - 'evals/shards-security-workflows.json'
      - 'docs/security-assurance.md'
      - 'docs/security-frameworks.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'plugins/shards-core/**'
      - 'tests/test_plugin_runtime.py'
      - 'tests/test_dispatch.py'
      - 'scripts/dispatch_skills.py'
      - 'scripts/shards_agent_harness.py'
      - 'tests/test_agent_harness.py'
      - 'docs/agent-harness.md'
      - 'scripts/search_skills.py'
      - 'tests/test_skill_search.py'
      - 'tests/test_manual_skill_search_actions.py'
      - '.github/workflows/search-shards-skills.yml'
      - 'docs/skill-discovery.md'
      - 'scripts/verify_plugins.py'
      - 'scripts/run_workflow.py'
      - '.agents/plugins/**'
      - 'skills/rebelytics-observer-rebelytics-observer/**'
      - '.github/workflows/agent-core-plugin.yml'
  pull_request:
    paths:
      - 'skills/trader-*/**'
      - 'third_party/day-trader-skill/**'
      - 'docs/day-trader-skills.md'
      - 'skills/shards-sec-*/**'
      - 'catalogue/catalogue.json'
      - 'catalogue/shards-security-controls.json'
      - 'scripts/security_assurance.py'
      - 'scripts/vibecode_guard.py'
      - 'tests/test_vibecode_guard.py'
      - 'tests/test_vibecode_guard_calibration.py'
      - 'tests/test_vibecode_guard_review.py'
      - 'tests/test_vibecode_guard_adversarial.py'
      - 'tests/test_security_assurance.py'
      - 'tests/test_security_suite.py'
      - 'tests/test_security_skill_eval.py'
      - 'scripts/security_skill_eval.py'
      - 'evals/shards-security-workflows.json'
      - 'docs/security-assurance.md'
      - 'docs/security-frameworks.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'plugins/shards-core/**'
      - 'tests/test_plugin_runtime.py'
      - 'tests/test_dispatch.py'
      - 'scripts/dispatch_skills.py'
      - 'scripts/shards_agent_harness.py'
      - 'tests/test_agent_harness.py'
      - 'docs/agent-harness.md'
      - 'scripts/search_skills.py'
      - 'tests/test_skill_search.py'
      - 'tests/test_manual_skill_search_actions.py'
      - '.github/workflows/search-shards-skills.yml'
      - 'docs/skill-discovery.md'
      - 'scripts/verify_plugins.py'
      - 'scripts/run_workflow.py'
      - '.agents/plugins/**'
      - 'skills/rebelytics-observer-rebelytics-observer/**'
      - '.github/workflows/agent-core-plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python entry points
        run: python -m py_compile plugins/shards-core/scripts/run.py scripts/run_workflow.py scripts/dispatch_skills.py scripts/shards_agent_harness.py scripts/search_skills.py scripts/verify_plugins.py scripts/security_assurance.py scripts/vibecode_guard.py scripts/security_skill_eval.py
      - name: Smoke test security assurance profiles
        run: |
          python scripts/security_assurance.py list
          python scripts/security_skill_eval.py cases
          python scripts/vibecode_guard.py --help
          python scripts/security_assurance.py plan --system 'CI demo' --profiles web,ai,crypto,fintech
      - name: Verify generated catalogue is reproducible
        run: |
          python scripts/build_catalogue.py
          git diff --exit-code -- catalogue/catalogue.json
      - name: Validate existing skill metadata
        run: python scripts/validate_skills.py
      - name: Heuristic skill security lint
        run: python scripts/security_lint.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned real Requests repository calibration
        run: |
          git clone --filter=blob:none https://github.com/psf/requests.git /tmp/shards-psf-requests
          git -C /tmp/shards-psf-requests checkout --detach 3c7baaa05ab4aa49cc819ce3a819d260de19c157
          test "$(git -C /tmp/shards-psf-requests rev-parse HEAD)" = 3c7baaa05ab4aa49cc819ce3a819d260de19c157
          PSF_REQUESTS=/tmp/shards-psf-requests python -m unittest discover -s tests -p 'test_vibecode_guard_calibration.py' -v
      - name: Exercise skill audit
        run: python plugins/shards-core/scripts/run.py audit-skill --path plugins/shards-core/skills/shards-skill-audit
      - name: Verify plugin and registry
        run: python scripts/verify_plugins.py --check
      - name: Smoke test governed dispatcher
        run: |
          python scripts/dispatch_skills.py list
          python scripts/dispatch_skills.py plan --skill shards-repository-health
          PLAN_SHA=$(python scripts/dispatch_skills.py plan --skill shards-repository-health | python -c 'import json,sys; print(json.load(sys.stdin)["plan_sha256"])')
          python scripts/dispatch_skills.py run --skill shards-repository-health --execute --expect-plan-sha256 "$PLAN_SHA"
      - name: Smoke test bounded three-agent read-only swarm
        run: |
          python scripts/shards_agent_harness.py plan --profile swarm
          python scripts/shards_agent_harness.py run --profile swarm --execute
      - name: Smoke test metadata-only skill discovery
        run: python scripts/search_skills.py --query "repository health" --status curated --limit 3
      - name: Exercise repository health
        run: python plugins/shards-core/scripts/run.py repository-health --repo .
