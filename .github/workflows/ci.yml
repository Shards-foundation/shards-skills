name: Skills CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill metadata and catalogue
        run: python scripts/validate_skills.py
      - name: Check generated catalogue is current
        run: |
          python scripts/build_catalogue.py
          git diff --exit-code -- catalogue/catalogue.json
      - name: Security heuristic lint
        run: python scripts/security_lint.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
