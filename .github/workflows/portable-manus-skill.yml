name: Portable Manus skill package

on:
  pull_request:
    paths:
      - 'skills/shards-sec-ai-agent-boundaries/**'
      - 'scripts/build_portable_security_skill.py'
      - 'tests/test_portable_security_skill.py'
      - 'scripts/security_assurance.py'
      - 'scripts/security_skill_eval.py'
      - 'scripts/vibecode_guard.py'
      - 'catalogue/shards-security-controls.json'
      - 'docs/security-assurance.md'
      - 'docs/security-frameworks.md'
      - 'evals/shards-security-workflows.json'
      - 'docs/portable-manus-skill.md'
      - '.github/workflows/portable-manus-skill.yml'
  push:
    branches: [main]
    paths:
      - 'skills/shards-sec-ai-agent-boundaries/**'
      - 'scripts/build_portable_security_skill.py'
      - 'tests/test_portable_security_skill.py'
      - 'scripts/security_assurance.py'
      - 'scripts/security_skill_eval.py'
      - 'scripts/vibecode_guard.py'
      - 'catalogue/shards-security-controls.json'
      - 'docs/security-assurance.md'
      - 'docs/security-frameworks.md'
      - 'evals/shards-security-workflows.json'
      - 'docs/portable-manus-skill.md'
      - '.github/workflows/portable-manus-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate byte-identical embedded resources
        run: python scripts/build_portable_security_skill.py --check
      - name: Execute isolated ZIP acceptance and corruption regressions
        run: python -m unittest discover -s tests -p 'test_portable_security_skill.py' -v
      - name: Produce deterministic installable skill artifact
        run: |
          mkdir -p dist
          python scripts/build_portable_security_skill.py --zip dist/shards-sec-ai-agent-boundaries.zip
          sha256sum dist/shards-sec-ai-agent-boundaries.zip
      # PRs execute the same acceptance tests but do not publish an installable
      # artifact. Only the reviewed, landed main branch may distribute it.
      - name: Publish trusted main-branch ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-manus-skill
          path: dist/shards-sec-ai-agent-boundaries.zip
          retention-days: 14
